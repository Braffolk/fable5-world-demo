# The COMPLETE official Mullastikukaart legend (muldade_tabel.pdf, "Mullastiku kaardi
# legend") — every canonical soil type incl. gleyed (g), eroded (E2/E3), peat-thickness
# (' / " / "') and turvastunud (1) variants is its own id. The pipeline ships the full
# taxonomy; collapsing into a material palette is a renderer/art decision, made later.
#
# id 0 = no data (cities/water/islets are legally unmapped in the source).
# id 255 = unparseable code (cook fails if these exceed `max_unknown_fraction`).
# Data normalization: curly apostrophes/quotes fold to ' and ", so M’’’ == M'".

max_unknown_fraction = 0.005

[types]
