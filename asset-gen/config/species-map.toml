# FULL Estonian tree-species taxonomy. Every Metsaregister species code is its own id in
# the cooked data (source of truth — the renderer maps ids -> archetypes for now, but the
# DATA stays full-resolution; see memory asset-gen-is-source-of-truth). id fits in u8.
#
# Each entry: id, latin, english, leaf ("conifer"|"broadleaf"), ref_height_m (nominal
# mature height; per-tree scale = detected_crown_h / ref_height_m). The manifest ships
# this whole dictionary so the client knows what each id is.

[species.MA] # harilik mänd
id = 0
latin = "Pinus sylvestris"
english = "Scots pine"
leaf = "conifer"
ref_height_m = 28.0

