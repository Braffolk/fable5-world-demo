[project]
name = "assetgen"
version = "0.1.0"
description = "Estonia 1:1 world data pipeline: fetch + cook open Estonian geodata into streamable chunked game assets"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3.9",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "pyproj>=3.6",
    "requests>=2.31",
    "click>=8.1",
    "pillow>=10.0",
    "zstandard>=0.22",
    "scipy>=1.17.1",
    "laspy[lazrs]>=2.5.4",
    "e57==0.2.3",
    "scikit-learn>=1.9.0",
]

[project.scripts]
assetgen = "assetgen.cli:main"

[dependency-groups]
dev = [
    "pypdf>=6.14.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assetgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
